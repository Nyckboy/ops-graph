version: "3.8"

services:
  neo4j:
    image: neo4j:5.12
    container_name: ops-graph-db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - ./neo4j-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1",
        ]
      interval: 10s
      retries: 5

  backend:
    build: ./backend
    container_name: opsguard-api
    ports:
      - "3000:3000"
    depends_on:
      - neo4j
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - DB_URI=neo4j://neo4j:7687
      - DB_USER=neo4j
      - DB_PASSWORD=password123

  frontend:
    build: ./frontend
    container_name: opsguard-ui
    ports:
      - "8080:80"
    depends_on:
      - backend
